<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FindFlat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #a61b11;
            height: 100vh; /* Full viewport height */
            display: flex; /* Use Flexbox */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            margin: 0; /* Remove default margin */
        }
        .register-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 1200px; /* Increased max width */
            width: 90%; /* Make it responsive */
            display: flex; /* Use flexbox for layout */
            font-size: 1.2rem; /* Increased base font size */
            margin: auto; /* Center the container */
            margin-top: 700px;
            position: relative; /* Positioning context for centering */
            top: 50%; /* Move down 50% */
            transform: translateY(-50%); /* Adjust for height */
            padding: 20px; /* Add padding for more space inside */
        }

        .register-img {
            background: url('/image/register.jpg') center center/cover no-repeat;
            height: 100%; /* Full height of container */
            flex: 1; /* Allow the image column to grow */
        }
        .form-section {
            padding: 2rem;
            flex: 1; /* Allow the form section to grow */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center content vertically */
        }
        .form-section h2 {
            font-size: 2rem; /* Increased title font size */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row register-container">
        <!-- Left column: Form -->
        <div class="col-md-6 form-section">
            <div class="w-100">
                <h2 class="text-center text-uppercase mb-3">Register</h2>
                <p class="text-center text-muted mb-4">
                    Create an account to join <span class="fw-semibold text-danger">Galang-Tan</span>
                </p>

                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" placeholder="Confirm your password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-danger">Register</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p>Already have an account? <a href="login.html" class="text-primary fw-semibold">Login Now</a></p>
                </div>
            </div>
        </div>

        <!-- Right column: Image -->
        <div class="col-md-6 p-0">
            <div class="register-img">
                <!-- Background image -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
